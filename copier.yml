_subdirectory: templates

_message_after_copy: |
  Your project has been created.

  Next steps:
    cd {{ _copier_conf.dst_path }}
    nix flake init -t github:jessedhillon/nix-templates#dev-kit
    direnv allow
    install-hooks
    poetry install --extras dev --extras test

  Conventions baked in:
    * Linear issue prefix: {{ module_name[:3].upper() }} (derived from module_name)
      Update scripts/worktree-create.sh and scripts/render-agent-prompt.py
      if your project uses a different Linear prefix.

  See README for details.

project_name:
  type: str
  help: Project name

project_description:
  type: str
  help: Short project description
  default: A web application built with FastAPI and React.

module_name:
  type: str
  help: Python module name

class_prefix:
  type: str
  help: Class prefix for project-related concepts

postgresql_port:
  type: int
  help: PostgreSQL server port
  default: 5432

memcached_port:
  type: int
  help: Memcached server port
  default: 11211

process_compose_port:
  type: int
  help: Process Compose HTTP server port
  default: 8080

rabbitmq_port:
  type: int
  help: RabbitMQ server port
  default: 5632

include_example_app:
  type: bool
  help: Include an example web application?
  default: true

include_example_model:
  type: bool
  help: Include an example database model?
  default: true

include_llm_scaffold:
  type: bool
  help: Include LLM integration scaffolding (langchain providers, prompt templates)?
  default: false

include_streaming:
  type: bool
  help: Include streaming/pub-sub scaffolding (redis + in-memory brokers)?
  default: false

include_auth:
  type: bool
  help: Include authentication scaffolding (JWT, login endpoints)?
  default: false

include_fixtures:
  type: bool
  help: Include YAML fixture loader for test/demo data?
  default: false

include_session_journal:
  type: bool
  help: Include opt-in LLM session-journal extraction and its PreCompact hook?
  default: false

include_tunnels:
  type: bool
  help: Include a vault-backed Cloudflare Tunnel command?
  default: false

# Computed values (not prompted)
web_apps:
  type: yaml
  when: false
  default: |-
    {% if include_example_app %}
    - name: Example
      module_name: example
      class_prefix: Example
      backend_port: 8081
      frontend_port: 9091
    {% else %}
    []
    {% endif %}

models:
  type: yaml
  when: false
  default: |-
    {% if include_example_model %}
    - class_name: Example
      table_name: example
    {% else %}
    []
    {% endif %}
